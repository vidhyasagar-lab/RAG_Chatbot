{% if documents %}
  {% for doc in documents %}
  <div class="flex items-center gap-2.5 px-3 py-2.5 rounded-xl hover:bg-dark-surface2/60 border border-transparent hover:border-dark-border/30 transition text-sm group" id="doc-{{ doc.doc_id }}">
    <div class="w-8 h-8 rounded-lg bg-accent-soft flex items-center justify-center flex-shrink-0">
      <svg class="w-4 h-4 text-accent-light" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m2.25 0H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"/></svg>
    </div>
    <div class="flex-1 min-w-0">
      <div class="truncate font-medium text-gray-200 group-hover:text-white transition" title="{{ doc.filename }}">{{ doc.filename }}</div>
      <div class="text-[11px] text-gray-500">
        {{ doc.chunks_added }} chunks{% if doc.images_extracted %} + {{ doc.images_extracted }} img{% endif %}
        &bull; {{ doc.uploaded_at[:10] }}
      </div>
    </div>
    <button onclick="deleteDoc('{{ doc.doc_id }}','{{ doc.filename }}')"
      class="opacity-0 group-hover:opacity-100 w-7 h-7 flex items-center justify-center text-gray-600 hover:text-red-400 flex-shrink-0 rounded-lg hover:bg-red-500/10 transition"
      title="Delete document &amp; chunks">
      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0"/></svg>
    </button>
  </div>
  {% endfor %}
{% else %}
  <div class="flex flex-col items-center justify-center py-10 text-sm text-gray-600">
    <svg class="w-8 h-8 mb-2 opacity-30" fill="none" stroke="currentColor" stroke-width="1" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m6.75 12H9m1.5-12H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"/></svg>
    No documents uploaded yet
  </div>
{% endif %}
