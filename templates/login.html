{% extends "base.html" %}
{% block title %}Login — RAG Chatbot{% endblock %}

{% block head %}
<style>
  .login-bg {
    background:
      radial-gradient(ellipse 80% 60% at 50% -20%, rgba(124, 92, 252, 0.12), transparent),
      radial-gradient(ellipse 60% 50% at 80% 100%, rgba(192, 132, 252, 0.06), transparent);
  }
  .card-glow {
    box-shadow:
      0 0 0 1px rgba(42, 45, 62, 0.6),
      0 8px 40px rgba(0, 0, 0, 0.4),
      0 0 80px rgba(124, 92, 252, 0.06);
  }
  .input-field {
    background: rgba(28, 29, 43, 0.6) !important;
    color: #fff !important;
    border: 1px solid rgba(42, 45, 62, 0.8);
    transition: all 0.25s cubic-bezier(.16,1,.3,1);
    caret-color: #7c5cfc;
  }
  .input-field:focus {
    background: rgba(28, 29, 43, 0.9) !important;
    border-color: rgba(124, 92, 252, 0.5);
    box-shadow: 0 0 0 3px rgba(124, 92, 252, 0.12), 0 0 20px rgba(124, 92, 252, 0.06);
  }
  .btn-primary {
    background: linear-gradient(135deg, #7c5cfc, #6345e0) !important;
    box-shadow: 0 4px 15px rgba(124, 92, 252, 0.25), inset 0 1px 0 rgba(255,255,255,0.1);
  }
  .btn-primary:hover {
    background: linear-gradient(135deg, #9b82fc, #7c5cfc) !important;
    box-shadow: 0 6px 25px rgba(124, 92, 252, 0.35), inset 0 1px 0 rgba(255,255,255,0.15);
    transform: translateY(-1px);
  }
  .btn-primary:active { transform: translateY(0); }
  .tab-active {
    background: rgba(124, 92, 252, 0.15);
    color: #9b82fc;
    box-shadow: inset 0 -2px 0 #7c5cfc;
  }
</style>
{% endblock %}

{% block body %}
<div class="min-h-full flex items-center justify-center px-4 py-8 sm:py-12 login-bg">
  <div class="w-full max-w-[420px] fade-up">

    <!-- Logo/Brand -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-accent-soft mb-4" style="animation: glow 3s ease-in-out infinite;">
        <svg class="w-8 h-8 text-accent-light" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09zM18.259 8.715L18 9.75l-.259-1.035a3.375 3.375 0 00-2.455-2.456L14.25 6l1.036-.259a3.375 3.375 0 002.455-2.456L18 2.25l.259 1.035a3.375 3.375 0 002.455 2.456L21.75 6l-1.036.259a3.375 3.375 0 00-2.455 2.456z" />
        </svg>
      </div>
      <h1 class="text-2xl sm:text-3xl font-bold text-white tracking-tight">RAG Chatbot</h1>
      <p class="text-sm text-gray-500 mt-2">Intelligent document assistant powered by AI</p>
    </div>

    <!-- Card -->
    <div class="rounded-2xl bg-dark-surface/90 card-glow backdrop-blur-xl overflow-hidden">

      <!-- Tabs -->
      <div class="flex border-b border-dark-border">
        <button id="tabLogin" onclick="switchAuthTab('login')"
          class="flex-1 py-3.5 text-sm font-semibold tracking-wide transition-all duration-200 tab-active">
          Sign In
        </button>
        <button id="tabRegister" onclick="switchAuthTab('register')"
          class="flex-1 py-3.5 text-sm font-semibold tracking-wide transition-all duration-200 text-gray-500 hover:text-gray-300">
          Create Account
        </button>
      </div>

      <!-- Login form -->
      <form id="formLogin" class="p-6 sm:p-8 space-y-5"
        hx-post="/login" hx-target="body" hx-swap="outerHTML" hx-indicator="#loginSpinner">
        <div>
          <label class="block text-xs font-medium text-gray-400 mb-2 ml-0.5 uppercase tracking-wider">Username</label>
          <input type="text" name="username" placeholder="Enter your username" maxlength="100" required autofocus
            class="input-field w-full px-4 py-3 rounded-xl text-white placeholder-gray-600 text-sm outline-none" />
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-400 mb-2 ml-0.5 uppercase tracking-wider">Password</label>
          <input type="password" name="password" placeholder="Enter your password" required
            class="input-field w-full px-4 py-3 rounded-xl text-white placeholder-gray-600 text-sm outline-none" />
        </div>
        <button type="submit"
          class="w-full py-3 rounded-xl text-white font-semibold text-sm flex items-center justify-center gap-2 mt-1 cursor-pointer"
          style="background:linear-gradient(135deg,#7c5cfc,#6345e0);box-shadow:0 4px 15px rgba(124,92,252,0.25),inset 0 1px 0 rgba(255,255,255,0.1)">
          <span class="htmx-hide-on-request">Sign In</span>
          <svg id="loginSpinner" class="htmx-indicator animate-spin h-5 w-5 text-white" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
          </svg>
        </button>
      </form>

      <!-- Register form (hidden) -->
      <form id="formRegister" class="p-6 sm:p-8 space-y-5 hidden"
        hx-post="/register" hx-target="body" hx-swap="outerHTML" hx-indicator="#regSpinner">
        <div>
          <label class="block text-xs font-medium text-gray-400 mb-2 ml-0.5 uppercase tracking-wider">Username</label>
          <input type="text" name="username" placeholder="Choose a username" maxlength="100" required
            class="input-field w-full px-4 py-3 rounded-xl text-white placeholder-gray-600 text-sm outline-none" />
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-400 mb-2 ml-0.5 uppercase tracking-wider">Password</label>
          <input type="password" name="password" placeholder="Min 8 characters" required minlength="8"
            class="input-field w-full px-4 py-3 rounded-xl text-white placeholder-gray-600 text-sm outline-none" />
        </div>
        <button type="submit"
          class="w-full py-3 rounded-xl text-white font-semibold text-sm flex items-center justify-center gap-2 mt-1 cursor-pointer"
          style="background:linear-gradient(135deg,#7c5cfc,#6345e0);box-shadow:0 4px 15px rgba(124,92,252,0.25),inset 0 1px 0 rgba(255,255,255,0.1)">
          <span class="htmx-hide-on-request">Create Account</span>
          <svg id="regSpinner" class="htmx-indicator animate-spin h-5 w-5 text-white" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
          </svg>
        </button>
      </form>

      {% if error %}
      <div class="px-6 sm:px-8 pb-6 -mt-2">
        <div class="flex items-center gap-2 text-red-400 text-sm bg-danger-soft border border-red-500/20 rounded-xl py-3 px-4">
          <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          {{ error }}
        </div>
      </div>
      {% endif %}

    </div>

    <!-- Footer -->
    <p class="text-center text-[11px] text-gray-600 mt-6">Powered by AI &bull; Hybrid RAG</p>
  </div>
</div>

<script>
function switchAuthTab(tab) {
  const tabLogin = document.getElementById('tabLogin');
  const tabRegister = document.getElementById('tabRegister');
  const formLogin = document.getElementById('formLogin');
  const formRegister = document.getElementById('formRegister');
  if (tab === 'login') {
    tabLogin.className = 'flex-1 py-3.5 text-sm font-semibold tracking-wide transition-all duration-200 tab-active';
    tabRegister.className = 'flex-1 py-3.5 text-sm font-semibold tracking-wide transition-all duration-200 text-gray-500 hover:text-gray-300';
    formLogin.classList.remove('hidden');
    formRegister.classList.add('hidden');
  } else {
    tabRegister.className = 'flex-1 py-3.5 text-sm font-semibold tracking-wide transition-all duration-200 tab-active';
    tabLogin.className = 'flex-1 py-3.5 text-sm font-semibold tracking-wide transition-all duration-200 text-gray-500 hover:text-gray-300';
    formRegister.classList.remove('hidden');
    formLogin.classList.add('hidden');
  }
}
{% if tab == 'register' %}switchAuthTab('register');{% endif %}
</script>
{% endblock %}
