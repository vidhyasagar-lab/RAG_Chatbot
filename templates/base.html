<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}RAG Chatbot{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <!-- Pinned: an unpinned tag silently follows upstream majors. 15.0.12 is
       the version the previous unpinned URL was already serving. -->
  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
  <!-- Required before any model output reaches innerHTML: marked emits raw
       HTML, and document text is attacker-supplied. -->
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.14/dist/purify.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          colors: {
            dark: {
              bg:      '#0a0a0f',
              surface: '#12131a',
              surface2:'#1c1d2b',
              surface3:'#252738',
              border:  '#2a2d3e',
              border2: '#363954',
            },
            accent: {
              DEFAULT: '#7c5cfc',
              light:   '#9b82fc',
              dark:    '#6345e0',
              soft:    'rgba(124, 92, 252, 0.12)',
              glow:    'rgba(124, 92, 252, 0.25)',
            },
            success: { DEFAULT: '#22c55e', soft: 'rgba(34, 197, 94, 0.12)' },
            danger:  { DEFAULT: '#ef4444', soft: 'rgba(239, 68, 68, 0.12)' },
            warn:    { DEFAULT: '#f59e0b', soft: 'rgba(245, 158, 11, 0.12)' },
          }
        }
      }
    }
  </script>
  <style>
    body { background: #0a0a0f; font-family: 'Inter', system-ui, sans-serif; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2a2d3e; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #4a4d6e; }

    /* Animations */
    @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideIn { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: none; } }
    @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
    @keyframes pulse-dot { 0%, 80%, 100% { opacity: .25; transform: scale(.85); } 40% { opacity: 1; transform: scale(1); } }
    @keyframes glow { 0%, 100% { box-shadow: 0 0 15px rgba(124, 92, 252, 0.15); } 50% { box-shadow: 0 0 25px rgba(124, 92, 252, 0.3); } }
    @keyframes loaderSpin { to { transform: rotate(360deg); } }
    @keyframes loaderPulse { 0%, 100% { opacity: .6; transform: scale(1); } 50% { opacity: 1; transform: scale(1.08); } }
    @keyframes loaderFadeOut { to { opacity: 0; visibility: hidden; } }

    .fade-up { animation: fadeUp .35s cubic-bezier(.16,1,.3,1); }
    .fade-in { animation: fadeIn .3s ease; }

    /* Page loader */
    #page-loader {
      position: fixed; inset: 0; z-index: 9999;
      background: #0a0a0f;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 20px;
      transition: opacity .4s ease, visibility .4s ease;
    }
    #page-loader.hide { animation: loaderFadeOut .4s ease forwards; }
    #page-loader .loader-ring {
      width: 44px; height: 44px;
      border: 3px solid rgba(124, 92, 252, 0.1);
      border-top-color: #7c5cfc;
      border-radius: 50%;
      animation: loaderSpin .8s linear infinite;
    }
    #page-loader .loader-text {
      font-size: 13px; font-weight: 500; color: #9b82fc;
      animation: loaderPulse 1.6s ease infinite;
      letter-spacing: 0.5px;
    }
    .slide-in { animation: slideIn .3s cubic-bezier(.16,1,.3,1); }

    .typing-dot { animation: pulse-dot 1.4s infinite both; }
    .typing-dot:nth-child(2) { animation-delay: .2s; }
    .typing-dot:nth-child(3) { animation-delay: .4s; }

    /* Glass effect */
    .glass { background: rgba(18, 19, 26, 0.8); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }

    /* Gradient text */
    .gradient-text { background: linear-gradient(135deg, #7c5cfc, #c084fc, #7c5cfc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-size: 200% 200%; }

    /* Gradient border */
    .gradient-border { position: relative; }
    .gradient-border::before {
      content: ''; position: absolute; inset: 0; border-radius: inherit; padding: 1px;
      background: linear-gradient(135deg, rgba(124, 92, 252, 0.3), rgba(192, 132, 252, 0.1), rgba(124, 92, 252, 0.3));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor; mask-composite: exclude;
    }

    /* Input focus glow */
    .input-glow, input:not([type="hidden"]):not([type="file"]):not([type="checkbox"]):not([type="radio"]):not([type="submit"]):not([type="button"]):not(.hidden), textarea, select {
      background: rgba(28, 29, 43, 0.6) !important;
      color: #fff !important;
      caret-color: #7c5cfc;
    }
    .input-glow:focus { box-shadow: 0 0 0 3px rgba(124, 92, 252, 0.15), 0 0 20px rgba(124, 92, 252, 0.08); }

    /* Subtle noise texture */
    .noise::after {
      content: ''; position: fixed; inset: 0; z-index: -1; opacity: 0.015; pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    }

    /* HTMX */
    .htmx-indicator { display: none; }
    .htmx-request .htmx-indicator { display: inline-flex; }
    .htmx-request .htmx-hide-on-request { display: none; }

    /* Smooth transitions on interactive elements */
    button, a, input, textarea { transition: all 0.2s cubic-bezier(.16,1,.3,1); }
  </style>
  {% block head %}{% endblock %}
</head>
<body class="h-full text-gray-300 font-sans noise" hx-boost="true">
  <!-- Page Loader -->
  <div id="page-loader">
    <div style="display:flex;flex-direction:column;align-items:center;gap:16px">
      <div class="loader-ring"></div>
      <div class="loader-text">Loading</div>
    </div>
  </div>
  {% block body %}{% endblock %}
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      var loader = document.getElementById('page-loader');
      if (loader) {
        loader.classList.add('hide');
        setTimeout(function() { loader.remove(); }, 450);
      }
    });
    // Failsafe: remove loader after 5s no matter what
    setTimeout(function() {
      var loader = document.getElementById('page-loader');
      if (loader) {
        loader.classList.add('hide');
        setTimeout(function() { loader.remove(); }, 450);
      }
    }, 5000);
  </script>
</body>
</html>
