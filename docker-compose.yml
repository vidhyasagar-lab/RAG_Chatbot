services:
  rag-chatbot:
    build: .
    container_name: rag-chatbot
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Mount the whole data dir: it now holds users.db alongside the vector
      # index, and both must survive a container rebuild.
      - ./data:/app/data
      - ./uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      # Uses the interpreter rather than curl, which is not present in the
      # slim base image — the previous curl probe could never succeed.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
